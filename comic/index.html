<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Даня и Пропавшие Уголки</title><style>
@font-face{font-family:N;src:url(fonts/Nunito.ttf);font-weight:100 1000}
html,body{margin:0;height:100%;background:#2b1a10;font-family:N;font-weight:900;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;transition:opacity .5s,transform .5s}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:center/cover;color:#fff;text-align:center;text-shadow:0 4px 0 #7a3a12,0 0 30px #000;transition:opacity .6s}
.scr h1{font-size:8vh;margin:0}.scr p{font-size:4vh;margin:2vh}.btn{background:#ffe58f;color:#5a2a08;text-shadow:none;border:5px solid #7a3a12;border-radius:30px;padding:1.5vh 5vh;font-size:4vh;cursor:pointer;box-shadow:0 8px 0 #c98a2b;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hide{opacity:0;pointer-events:none}
#nav{position:absolute;bottom:1.2vh;right:1.5vw;display:flex;gap:10px;z-index:9}
#nav div{background:#fff8e8;border:4px solid #2b1a10;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
#prog{position:absolute;top:0;left:0;height:8px;background:#ff7a2a;transition:width .5s;z-index:9}
#num{position:absolute;top:14px;right:20px;color:#fff;font-size:22px;z-index:9;text-shadow:0 2px 4px #000}
</style></head><body>
<iframe id="f"></iframe><div id="prog"></div><div id="num"></div>
<div id="nav" class="hide"><div id="pv">⏮</div><div id="nx">⏭</div></div>
<div class="scr" id="cover" style="background-image:linear-gradient(#0006,#0003),url(img/p10_1.jpg)"><h1>Даня и Пропавшие Уголки</h1><p>Комикс о точках, линиях и фигурах</p><div class="btn" id="go">Читать ▶</div><a class="pdf" href="dania_comic.pdf" download style="display:block;margin-top:14px;color:#ffe9b0;font-size:18px">⬇ Скачать PDF</a></div>
<div class="scr hide" id="fin" style="background-image:linear-gradient(#0007,#0004),url(img/p10_2.jpg)"><h1>А какие фигуры видишь ты дома?</h1><p>🔺 Треугольник? ⬛ Квадрат? ⚪ Круг? Найди и покажи!</p><div class="btn" id="again">Читать снова ↺</div><a class="pdf" href="dania_comic.pdf" download style="display:block;margin-top:14px;color:#ffe9b0;font-size:18px">⬇ Скачать PDF</a></div>
<script>
const N=10;let p=0;const f=document.getElementById('f'),$=id=>document.getElementById(id);
function show(n){p=n;$('cover').classList.toggle('hide',n!=0);$('fin').classList.toggle('hide',n!=N+1);$('nav').classList.toggle('hide',n==0);
 if(n>=1&&n<=N){f.src='page'+n+'.html';$('num').textContent='стр. '+n+' / '+N}else $('num').textContent='';
 $('prog').style.width=(Math.min(n,N)/N*100)+'%'}
$('go').onclick=()=>show(1);$('again').onclick=()=>show(1);$('nx').onclick=()=>show(Math.min(N+1,p+1));$('pv').onclick=()=>show(Math.max(0,p-1));
addEventListener('keydown',e=>{if(e.key=='ArrowRight')$('nx').onclick();if(e.key=='ArrowLeft')$('pv').onclick()});
</script></body></html>
