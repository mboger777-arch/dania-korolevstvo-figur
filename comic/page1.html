<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Даня и Пропавшие Уголки — стр. 1</title>
<style>
@font-face{font-family:N;src:url("fonts/Nunito.ttf");font-weight:200 1000}
html,body{margin:0;height:100%;background:#2a1a10;overflow:hidden;font-family:N,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;transform-origin:0 0;background:#f4e6c8}
#bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(26px) brightness(.8) saturate(1.1);transition:background-image .6s,opacity .8s}
.pn{position:absolute;left:0;top:0;width:960px;height:720px;transform-origin:0 0;transition:transform 1s cubic-bezier(.6,0,.25,1),opacity .7s;opacity:0;border-radius:0;overflow:hidden}
.pn .cam{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 3.2s ease-out}
.pn img{width:100%;height:100%;display:block}
.pn .frame{position:absolute;inset:0;border:0 solid #4a2a14;border-radius:0;transition:.8s;pointer-events:none}
.ov .pn .frame{border-width:12px;border-radius:30px}
.ov .pn{border-radius:30px;box-shadow:0 10px 26px rgba(60,30,10,.4)}
svg.layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.bub{transform-box:view-box;opacity:0}
.bub.on{opacity:1;animation:blow .62s cubic-bezier(.25,1.6,.45,1) both}
@keyframes blow{0%{transform:scale(.05);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}
.txt{position:absolute;text-align:center;font-weight:900;color:#2d1a0c;font-size:40px;line-height:1.08;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .2s}
.txt.on{opacity:1}
.txt .w{opacity:0;display:inline-block;transform:translateY(8px) scale(.8);transition:opacity .16s,transform .28s cubic-bezier(.3,1.8,.5,1)}
.txt .w.on{opacity:1;transform:none}
.txt em{font-style:normal;color:#e0601a}
.txt.shout{font-size:44px;letter-spacing:.5px}
.glow{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(rgba(255,240,170,.55),rgba(255,230,150,0) 65%);opacity:0;transition:opacity .5s;mix-blend-mode:screen;pointer-events:none}
.glow.on{opacity:1;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#title{position:absolute;left:0;right:0;top:14px;text-align:center;font-weight:900;font-size:46px;color:#7a3a12;opacity:0;transition:.8s;text-shadow:0 3px 0 #fff4cf}
.ov #title{opacity:1}
#rule{position:absolute;left:50%;bottom:16px;transform:translate(-50%,220%) rotate(-2deg);background:#ffe58f;border:5px solid #7a3a12;border-radius:26px;padding:10px 34px;font-weight:900;font-size:30px;color:#5a2a08;white-space:nowrap;box-shadow:0 8px 0 #c98a2b;transition:transform .9s cubic-bezier(.3,1.6,.5,1)}
#rule.on{transform:translate(-50%,0) rotate(-1deg)}
#rule em{font-style:normal;color:#e0601a}
#rule .star{display:inline-block;animation:spin 3s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.ui{position:absolute;bottom:18px;width:64px;height:64px;border-radius:50%;background:rgba(255,248,230,.9);border:4px solid #7a3a12;display:flex;align-items:center;justify-content:center;font-size:30px;color:#7a3a12;cursor:pointer;z-index:5}
#back{left:18px}#auto{left:94px}
#hand{position:absolute;right:30px;bottom:24px;font-size:58px;opacity:0;transition:opacity .5s;z-index:5;animation:tap 1s ease-in-out infinite}
#hand.on{opacity:1}
@keyframes tap{50%{transform:translateY(-12px) scale(.92)}}
.video .ui,.video #hand{display:none}
</style></head><body>
<div id="stage"><div id="bg"></div><div id="title">Даня и Пропавшие Уголки</div><div id="panels"></div>
<div id="rule"><span class="star">⭐</span>Правило: <em>точка</em> — самая маленькая фигура. С неё начинается рисунок!</div>
<div class="ui" id="back" title="Назад">◀</div><div class="ui" id="auto" title="Авто">▶</div><div id="hand">👆</div></div>
<script>
// Сюжет страницы. tip — кончик хвоста у рта (в % кадра), c — центр облачка, type: say|shout|think, voice — место для озвучки
const PAGE=[
 {img:'img/p1_1.jpg',lines:[
  {who:'q',c:[21,13],tip:[23,30],face:[28,44],t:'Ура, День Фигур!|Начнём с *точки*!',voice:'p1_q1'},
  {who:'d',c:[73,17],tip:[58,33],face:[52,46],t:'Я помогу!',type:'shout',voice:'p1_d1'}]},
 {img:'img/p1_2.jpg',lines:[
  {who:'q',c:[14,12],tip:[25,25],face:[38,38],t:'Смотри:|*точка*!',voice:'p1_q2'},
  {who:'d',c:[72,9],tip:[64,19],face:[63,46],t:'Такая крошка?',voice:'p1_d2'}]},
 {img:'img/p1_3.jpg',lines:[
  {who:'q',c:[44,11],tip:[29,24],face:[22,32],t:'С *точки*|всё начинается!',voice:'p1_q3'},
  {who:'d',c:[83,20],tip:[73,31],face:[69,42],t:'Ух ты!|*Фигуры*!',type:'shout',voice:'p1_d3'}]},
 {img:'img/p1_4.jpg',lines:[
  {who:'k',c:[19,30],tip:[24,47],face:[25,68],t:'Ой-ой…|кто это?',type:'think',voice:'p1_k1'},
  {who:'v',c:[40,11],tip:[53,22],face:[61,42],t:'Я спешу-у-у!',type:'shout',voice:'p1_v1'}]}];
const VOICE={}; // VOICE['p1_q1']=new Audio('voice/p1_q1.mp3')
const NS='http://www.w3.org/2000/svg',W=960,H=720,st=document.getElementById('stage'),q=new URLSearchParams(location.search);
if(q.has('video'))document.body.classList.add('video');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`scale(${s}) translate(-50%,-50%)`}addEventListener('resize',fit);fit();
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function blob(cx,cy,rx,ry,n,j){let p=[];for(let i=0;i<n;i++){const a=i/n*2*Math.PI,r=1+(rnd()-.5)*j;p.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}return p}
function smooth(p){let d='';const n=p.length;for(let i=0;i<n;i++){const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];
 if(!i)d+=`M${b[0]},${b[1]}`;d+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}return d+'Z'}
function el(t,a,par){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);par&&par.appendChild(e);return e}
function build(){const root=document.getElementById('panels');PAGE.forEach((P,pi)=>{
 const pn=document.createElement('div');pn.className='pn';pn.innerHTML=`<div class="cam"><img src="${P.img}"><div class="glows"></div><svg class="layer" viewBox="0 0 ${W} ${H}"></svg><div class="txts"></div></div><div class="frame"></div>`;root.appendChild(pn);P.el=pn;
 const svg=pn.querySelector('svg'),T=pn.querySelector('.txts'),G=pn.querySelector('.glows');
 P.lines.forEach(L=>{
  // текст: измеряем
  const tx=document.createElement('div');tx.className='txt'+(L.type=='shout'?' shout':'');
  tx.innerHTML=L.t.split('|').map(r=>'<div>'+r.split(' ').map(w=>'<span class="w">'+w.replace(/\*(.+?)\*/g,'<em>$1</em>')+'</span>').join(' ')+'</div>').join('');
  T.appendChild(tx);const bw=tx.offsetWidth,bh=tx.offsetHeight;
  const cx=L.c[0]/100*W,cy=L.c[1]/100*H+bh/2-10,tipx=L.tip[0]/100*W,tipy=L.tip[1]/100*H;
  const rx=bw/2*1.32+26,ry=bh/2*1.38+20;
  tx.style.left=(cx-bw/2)+'px';tx.style.top=(cy-bh/2)+'px';
  const g=el('g',{class:'bub',style:`transform-origin:${tipx}px ${tipy}px`},svg);
  const fill='#fff8e8',ink='#2b1a10';
  let body,tail=[];
  if(L.type=='shout'){const n=18;let p=[];for(let i=0;i<n*2;i++){const a=i/(n*2)*2*Math.PI,k=i%2?1:1.22+rnd()*.12;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}body='M'+p.map(v=>v.join(',')).join('L')+'Z'}
  else if(L.type=='think'){let p=blob(cx,cy,rx,ry,10,.05);body='';const n=p.length;for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];const r=Math.hypot(b[0]-a[0],b[1]-a[1])/2;body+=(i?'':'M'+a.join(','))+`A${r*1.15},${r*1.15} 0 0 1 ${b.join(',')}`}body+='Z'}
  else body=smooth(blob(cx,cy,rx,ry,14,.06));
  // хвост
  const ang=Math.atan2(tipy-cy,tipx-cx),bx=cx+Math.cos(ang)*rx*.75,by=cy+Math.sin(ang)*ry*.75,nx=-Math.sin(ang),ny=Math.cos(ang),wb=26;
  let tl='';
  if(L.type=='think'){[[.35,16],[.62,11],[.85,7]].forEach(([f,r])=>{const x=bx+(tipx-bx)*f,y=by+(tipy-by)*f;tail.push(['circle',{cx:x,cy:y,r}])})}
  else{const mx=(bx+tipx)/2+nx*18,my=(by+tipy)/2+ny*18;tl=`M${bx+nx*wb},${by+ny*wb} Q${mx},${my} ${tipx},${tipy} Q${mx-nx*8},${my-ny*8} ${bx-nx*wb},${by-ny*wb}Z`}
  const sh=el('g',{transform:'translate(5,8)',opacity:.28},g);el('path',{d:body,fill:'#3a1d08'},sh);tl&&el('path',{d:tl,fill:'#3a1d08'},sh);
  // неровная обводка: два прохода разной толщины
  [[9,0],[5,1.8]].forEach(([w,o])=>{const s=el('g',{transform:`translate(${o},${-o*.6})`},g);el('path',{d:body,fill:'none',stroke:ink,'stroke-width':w,'stroke-linejoin':'round'},s);tl&&el('path',{d:tl,fill:'none',stroke:ink,'stroke-width':w,'stroke-linejoin':'round'},s);tail.forEach(([t,a])=>el(t,{...a,fill:'none',stroke:ink,'stroke-width':w*.8},s))});
  el('path',{d:body,fill:fill},g);tl&&el('path',{d:tl,fill:fill},g);tail.forEach(([t,a])=>el(t,{...a,fill:fill},g));
  el('path',{d:body,fill:'none',stroke:'#fff','stroke-width':3,opacity:.6,transform:`translate(${-rx*.04},${-ry*.06}) scale(1)`,'stroke-dasharray':'60 400'},g);
  const gl=document.createElement('div');gl.className='glow';gl.style.left=L.face[0]+'%';gl.style.top=L.face[1]+'%';G.appendChild(gl);
  L.g=g;L.tx=tx;L.gl=gl;L.words=[...tx.querySelectorAll('.w')];});});}
// раскладки
function solo(pi){PAGE.forEach((P,i)=>{P.el.style.opacity=i==pi?1:0;P.el.style.transform=`translate(160px,0) scale(1)`;P.el.style.zIndex=i==pi?2:1});document.getElementById('bg').style.backgroundImage=`url(${PAGE[pi].img})`;st.classList.remove('ov')}
function overview(){st.classList.add('ov');const s=.35,w=W*s,h=H*s,g=16,x0=(1280-2*w-g)/2,y0=68;PAGE.forEach((P,i)=>{P.el.style.opacity=1;P.el.style.transform=`translate(${x0+(i%2)*(w+g)}px,${y0+Math.floor(i/2)*(h+g)}px) scale(${s})`;P.el.querySelector('.cam').style.transform='none'});document.getElementById('bg').style.opacity=0}
// последовательность
const steps=[];PAGE.forEach((P,pi)=>{steps.push({k:'panel',pi});P.lines.forEach(L=>steps.push({k:'line',pi,L}))});steps.push({k:'ov'},{k:'rule'});
let cur=-1,typing=null,timer=null,auto=q.has('auto')||q.has('video');
function clearTyping(){if(typing){clearInterval(typing);typing=null}}
function finishLine(L){L.words.forEach(w=>w.classList.add('on'))}
function render(i,instant){// показать состояние после шага i
 clearTyping();PAGE.forEach(P=>P.lines.forEach(L=>{L.g.classList.remove('on');L.tx.classList.remove('on');L.words.forEach(w=>w.classList.remove('on'));L.gl.classList.remove('on')}));
 document.getElementById('rule').classList.remove('on');document.getElementById('bg').style.opacity=1;
 const s=steps[i];const shownUpTo=i;
 if(s.k=='ov'||s.k=='rule'){overview();PAGE.forEach(P=>P.lines.forEach(L=>{L.g.classList.add('on');L.tx.classList.add('on');finishLine(L)}));if(s.k=='rule')document.getElementById('rule').classList.add('on');return 0}
 solo(s.pi);const P=PAGE[s.pi],cam=P.el.querySelector('.cam');
 // уже прочитанные реплики этого кадра
 let last=null;for(let j=0;j<=shownUpTo;j++){const t=steps[j];if(t.k=='line'&&t.pi==s.pi){t.L.g.classList.add('on');t.L.tx.classList.add('on');if(j<shownUpTo||instant)finishLine(t.L);last=t.L}}
 if(s.k=='panel'){cam.style.transition='none';cam.style.transform='scale(1.0)';requestAnimationFrame(()=>{cam.style.transition='';cam.style.transform='scale(1.05)'});return 1100}
 const L=s.L;cam.style.transform=`scale(1.04)`;cam.style.transformOrigin=`${L.face[0]}% ${L.face[1]}%`;L.gl.classList.add('on');
 if(VOICE[L.voice])VOICE[L.voice].play();
 let k=0;setTimeout(()=>{typing=setInterval(()=>{if(k<L.words.length)L.words[k++].classList.add('on');else clearTyping()},150)},380);
 const chars=L.t.replace(/[*|]/g,'').length;return 380+L.words.length*150+700+chars*42}
function go(d){if(d>0&&typing){const s=steps[cur];finishLine(s.L);clearTyping();schedule(900);return}
 const n=Math.max(0,Math.min(steps.length-1,cur+d));if(n==cur)return;cur=n;const t=render(cur);schedule(t)}
function schedule(t){clearTimeout(timer);hand(false);timer=setTimeout(()=>{if(auto&&cur<steps.length-1)go(1);else if(cur<steps.length-1)hand(true)},auto?t:Math.max(t,2500))}
function hand(on){document.getElementById('hand').classList.toggle('on',on)}
document.getElementById('back').onpointerdown=e=>{e.stopPropagation();go(-1)};
const ab=document.getElementById('auto');ab.onpointerdown=e=>{e.stopPropagation();auto=!auto;ab.textContent=auto?'❚❚':'▶';if(auto)go(1)};ab.textContent=auto?'❚❚':'▶';
// свайп: влево — дальше, вправо — назад; тап — дальше
function toParent(m){try{parent.postMessage(m,'*')}catch(e){}}
function fwd(){if(cur>=steps.length-1&&!typing){toParent('next');return}go(1)}
function bwd(){if(cur<=0){toParent('prev');return}go(-1)}
let sx=null,sy=0,dx=0;st.style.touchAction='none';document.documentElement.style.touchAction='none';
st.addEventListener('pointerdown',e=>{toParent('tap');sx=e.clientX;sy=e.clientY;dx=0;st.style.transition='none'});
addEventListener('pointermove',e=>{if(sx===null)return;dx=e.clientX-sx;st.style.translate=(dx*.6)+'px 0'});
function up(e){if(sx===null)return;const ady=Math.abs(e.clientY-sy);sx=null;st.style.transition='translate .35s cubic-bezier(.2,.8,.3,1)';
 if(Math.abs(dx)>45&&Math.abs(dx)>ady){const d=dx<0?1:-1;st.style.translate=(d>0?-90:90)+'px 0';setTimeout(()=>{st.style.transition='none';st.style.translate=(d>0?90:-90)+'px 0';requestAnimationFrame(()=>{st.style.transition='translate .35s cubic-bezier(.2,.8,.3,1)';st.style.translate='0 0'});d>0?fwd():bwd()},160)}
 else{st.style.translate='0 0';if(Math.abs(dx)<10)fwd()}}
addEventListener('pointerup',up);addEventListener('pointercancel',e=>{sx=null;st.style.translate='0 0'});
addEventListener('message',e=>{if(e.data=='fwd')fwd();if(e.data=='bwd')bwd()});
document.fonts.ready.then(()=>{build();if(q.has('all')||q.has('end')){cur=steps.length-1;render(cur,true)}else go(1);window.READY=true});
</script></body></html>
